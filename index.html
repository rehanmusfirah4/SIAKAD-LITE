<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Siakad lite</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">

</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-md-5">
                <div class="shadow-sm">
                    <div class="card-body p-4">

                        <h4 class="text-center text-muted mb-4">Siakad Lite</h4>
                        <p class="text-center text-muted mb-4">Silahkan masuk ke akun anda</p>

                        <form id="formLogin">

                            <div class="mb-3">
                                <label for="inputNim" class="form-label">NIM : </label>
                                <input type="number" id="inputNim" class="form-control" placeholder="123456">
                            </div>

                            <div class="mb-3">
                                <label for="inputPassword" class="form-label">Password :</label>
                                <input type="password" class="form-control" id="inputPassword" placeholder="password anda">
                            </div>

                            <div id="pesanError" class="alert alert-danger d-none">NIM atau password kamu salah</div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" >Masuk</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    







    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</html>
